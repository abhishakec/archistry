name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Self-test
        run: node scripts/archistry.mjs doctor
      - name: Build and validate every example
        run: node scripts/build-examples.mjs --no-png
      - name: Regression snapshot (all types, round trips, CLI commands)
        run: node evals/regress.mjs . regress.json
