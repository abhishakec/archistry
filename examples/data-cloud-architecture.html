* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 "Salesforce Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; overflow: hidden; }
#app { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr auto; height: 100vh; }
#bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; z-index: 5; }
#bar .title { font-weight: 700; font-size: 14px; margin-right: 6px; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#bar .grow { flex: 1; }
button, select, input, textarea { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 9px; cursor: pointer; white-space: nowrap; line-height: 1.2; }
.btn:hover { background: var(--hover); border-color: var(--accent); }
.btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }

.group { display: inline-flex; }
.group .btn { border-radius: 0; margin-left: -1px; }

.menu { position: relative; display: inline-block; }
.menu .pop { display: none; position: absolute; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 210px; padding: 4px; z-index: 20; }
